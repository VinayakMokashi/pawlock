name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: macos-latest   # no arm64 build of 3.9 on the macOS runners
            python: "3.9"
        include:
          - os: macos-latest
            python: "3.10"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test (headless; no input hooks are installed)
        run: pytest

      - name: Detector benchmark (summary)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python scripts/detector_benchmark.py --runs 20 >> "$GITHUB_STEP_SUMMARY"
